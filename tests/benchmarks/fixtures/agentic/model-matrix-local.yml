# One scripted model family on the air-gapped arm, for the host offline-check tests.
# Provider ollama: its units are unmetered, never priced or booked. `script` is
# relative to this directory; plan_jobs makes it absolute. The two hosted scripted
# families are here only because every matrix must name an openai and a google
# family (benchmarks.model_matrix.REQUIRED_PROVIDERS); the tests never run them.
schema_version: 1
methodology_token_label: "Claude Tokens (Normalized Payload)"

model_families:
  - id: scripted-local
    provider: ollama
    model_id: scripted-local-1
    api: scripted
    arm: air-gapped
    client: scripted
    script: script-local.yml
    token_count_method: claude_normalized_payload
    latency_scope: request_dispatch_to_final_answer
    max_output_tokens: 1024
    framing_allowance_tokens: 256
    headline_eligible: false
    headline_ineligibility_reason: Test fixture with a scripted model; never a public result.

  - id: scripted-openai
    provider: openai
    model_id: scripted-2
    api: scripted
    arm: hosted
    client: scripted
    script: script-openai.yml
    token_count_method: claude_normalized_payload
    latency_scope: request_dispatch_to_final_answer
    max_input_tokens: 200000
    max_output_tokens: 1024
    output_cap_includes_reasoning: true
    framing_allowance_tokens: 256
    headline_eligible: false
    headline_ineligibility_reason: Test fixture with a scripted model; never a public result.

  - id: scripted-google
    provider: google
    model_id: scripted-3
    api: scripted
    arm: hosted
    client: scripted
    script: script-google.yml
    token_count_method: claude_normalized_payload
    latency_scope: request_dispatch_to_final_answer
    max_input_tokens: 200000
    max_output_tokens: 1024
    output_cap_includes_reasoning: true
    framing_allowance_tokens: 256
    headline_eligible: false
    headline_ineligibility_reason: Test fixture with a scripted model; never a public result.
