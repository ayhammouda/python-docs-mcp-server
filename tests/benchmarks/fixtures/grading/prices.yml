# Flat round prices for the scripted grading fixtures. Standard rates as in
# tests/benchmarks/fixtures/agentic/prices.yml; every model is booked at half
# rate in a batch (batch_multiplier 0.5, as every committed model). No expiry:
# scripted runs are never live.
schema_version: 1
currency: USD
unit: per_million_tokens
captured_on: "2026-11-04"
expires_on: null
source: tests/benchmarks/fixtures/grading/prices.yml

