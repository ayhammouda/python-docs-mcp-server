# Model matrix for the agentic public benchmark.
#
# Context: docs/benchmarks/AGENTIC-BENCHMARK-DESIGN.md section 7.1 (parent
# issue #63). This file is that table: three hosted models and one air-gapped
# model. Every hosted token limit cites the research note
# docs/research/2026-10-31-benchmark-provider-limits.md, which quotes each
# vendor page it took a value from. See
# docs/benchmarks/PUBLIC-BENCHMARK-METHODOLOGY.md for the methodology.
#
# This file defines the MODEL axis of the benchmark's evaluation matrix. The
# systems under test (design section 5) are the other axis. Every system is
# evaluated against every model family listed here, independently. Scores are
# never averaged across model families; any aggregate across model families
# is secondary and must be clearly labeled as an aggregate in reports (see
# benchmarks/model_matrix.py:tool_model_cells).
#
# Agentic fields (validated by benchmarks.model_matrix.model_family_from_raw):
# - api: the provider API the harness's client speaks.
# - arm: `hosted` (billed, so its spend bound needs every token field below)
#   or `air-gapped` (local Ollama, no spend).
# - max_input_tokens: the input bound used for the spend check.
# - max_output_tokens: the output cap sent on every call. 32,768 for every
#   hosted model (owner ruling on #184), below each documented maximum.
# - output_cap_includes_reasoning: thinking or reasoning tokens count inside
#   max_output_tokens, so no extra reasoning budget is added to the bound.
# - framing_allowance_tokens: tokens added to the input bound per message for
#   wrappers and provider-injected text (design section 12; at least 256).
# - limits_source: the research note section the limits come from.
#
# Loaded and schema-validated by benchmarks.model_matrix.load_model_matrix().
schema_version: 1

# Tokens computed by the benchmark's own methodology tokenizer (per
# PUBLIC-BENCHMARK-METHODOLOGY.md "Token Measurement": Claude token counting
# after client-side rewrap) are always reported under this exact label,
# regardless of which provider/model produced the answer. This keeps the
# cross-model comparable metric from ever being confused with a provider's
# own billing/usage tokens (Anthropic and OpenAI `usage`, Google
# `usage_metadata`), which are recorded per entry below only as separate
# diagnostic and cost data.
methodology_token_label: "Claude Tokens (Normalized Payload)"

model_families:
  - id: claude-sonnet-5-5
    provider: anthropic
    model_id: claude-sonnet-5-5
    api: anthropic-messages
    arm: hosted
    client: anthropic
    # How the primary, cross-model comparable token count is produced for
    # this entry. `claude_normalized_payload` means: the methodology
    # tokenizer is applied to the client-rewrapped message envelope, per
    # PUBLIC-BENCHMARK-METHODOLOGY.md; that count is reported under the
    # `methodology_token_label` above, never as this provider's own tokens.
    token_count_method: claude_normalized_payload
    # Diagnostic and cost only: this provider's own usage object, recorded
    # separately and never reported under methodology_token_label.
    provider_native_token_field: usage
    latency_scope: request_dispatch_to_final_answer
    settings: >-
      Provider default effort; no sampling parameters (Claude 5.5 rejects
      them). Adaptive thinking is on by default and cannot be disabled; the
      documented default effort is `high`.
    # Documented as "1M tokens". The exact integer needs the Models API: each
    # live worker reads it at startup, and the smoke run's run-summary.json
    # lists any difference under model_limits_mismatch.
    max_input_tokens: 1000000
    # Documented maximum 128,000.
    max_output_tokens: 32768
    output_cap_includes_reasoning: true
    framing_allowance_tokens: 256
    limits_source: docs/research/2026-10-31-benchmark-provider-limits.md#a-claude-sonnet-5-5-anthropic-messages-api
    headline_eligible: false
    headline_ineligibility_reason: >-
      No live benchmark run has been executed against this model family yet;
      per roadmap decision 5.17, no comparative claim may cite this entry
      until the harness produces reproducible live data.

  - id: gpt-6.1-sol
    provider: openai
    model_id: gpt-6.1-sol
    api: openai-responses
    arm: hosted
    client: openai
    token_count_method: claude_normalized_payload
    provider_native_token_field: usage
    latency_scope: request_dispatch_to_final_answer
    settings: >-
      Provider default reasoning effort. The documented default effort is
      `medium`.
    # No separate input limit is published: the 1,050,000-token context
    # window minus the 32,768-token output cap.
    max_input_tokens: 1017232
    # Documented maximum 128,000.
    max_output_tokens: 32768
    output_cap_includes_reasoning: true
    framing_allowance_tokens: 256
    limits_source: docs/research/2026-10-31-benchmark-provider-limits.md#b-gpt-61-sol-openai-responses-api
    headline_eligible: false
    headline_ineligibility_reason: >-
      No live benchmark run has been executed against this model family yet;
      per roadmap decision 5.17, no comparative claim may cite this entry
      until the harness produces reproducible live data.

  - id: gemini-3.8-flash
    provider: google
    model_id: gemini-3.8-flash
    # `generate_content` with automatic function calling disabled, paid tier.
    api: gemini-generate-content
    arm: hosted
    client: google-genai
    token_count_method: claude_normalized_payload
    provider_native_token_field: usage_metadata
    latency_scope: request_dispatch_to_final_answer
    settings: >-
      Provider default thinking level. Run before 2027-01-01, when its price
      doubles, or refresh the price snapshot. The documented default thinking
      level is `medium`.
    # Documented input token limit.
    max_input_tokens: 1048576
    # Documented maximum 65,536.
    max_output_tokens: 32768
    output_cap_includes_reasoning: true
    framing_allowance_tokens: 256
    limits_source: docs/research/2026-10-31-benchmark-provider-limits.md#c-gemini-38-flash-gemini-api-google-genai-paid-tier
    headline_eligible: false
    headline_ineligibility_reason: >-
      No live benchmark run has been executed against this model family yet;
      per roadmap decision 5.17, no comparative claim may cite this entry
      until the harness produces reproducible live data.

  - id: gemma4-12b
    provider: ollama
    model_id: gemma4:12b
    api: openai-chat-completions
    arm: air-gapped
    client: openai
    token_count_method: claude_normalized_payload
    provider_native_token_field: usage
    latency_scope: request_dispatch_to_final_answer
    settings: >-
      Ollama defaults except `OLLAMA_CONTEXT_LENGTH=32768` for both local
      systems (the default on a 16 GB machine is 4,096, which cannot hold
      seven tool schemas plus a docs result, and the OpenAI-compatible
      endpoint cannot change it per request). 12B fits the maintainer's
      16 GB M1 Pro; 26B and 31B do not.
    # The loop's per-call bounds need both; neither is ever sent to Ollama
    # (Ollama defaults, no max_tokens) and the unit is never priced.
    max_output_tokens: 32768
    framing_allowance_tokens: 256
    headline_eligible: false
    headline_ineligibility_reason: >-
      No live benchmark run has been executed against this model family yet;
      per roadmap decision 5.17, no comparative claim may cite this entry
      until the harness produces reproducible live data.
