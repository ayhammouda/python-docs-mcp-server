name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eligibility:
    name: Release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-sha: ${{ steps.gate.outputs.build-sha }}
      target-tag: ${{ steps.gate.outputs.target-tag }}
    permissions:
      contents: read
      checks: read
      # Also covers listing the PR's issue comments; no issues scope needed.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require verified main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_gate.py

  build:
    needs: eligibility
    runs-on: ubuntu-latest
    name: Build & Test
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ needs.eligibility.outputs.target-tag }}
    outputs:
      dist-id: ${{ steps.upload-dist.outputs.artifact-id }}
      dist-sha256: ${{ steps.dist-sha256.outputs.dist-sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.build-sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python 3.13
        run: |
          uv python install 3.13
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/release-product-venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --dev --no-install-project --no-build

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi
          SERVER_VERSION=$(uv run --no-sync python -c "import json; print(json.load(open('server.json'))['version'])")
          PACKAGE_VERSION=$(uv run --no-sync python -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match server.json version ${SERVER_VERSION}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match server.json package version ${PACKAGE_VERSION}"
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

      - name: Build package
        run: uv build --build-constraint .github/build-constraints.txt --require-hashes

      - name: Install the built wheel
        run: uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps dist/*.whl

      - name: Verify wheel contents and installed database bootstrap
        run: |
          uv run --no-sync python - <<'PY'
          import sqlite3
          import sysconfig
          import zipfile
          from pathlib import Path
          from mcp_server_python_docs.storage import db

          wheel, = Path("dist").glob("*.whl")
          installed = Path(db.__file__).resolve().parents[1]
          assert installed.is_relative_to(Path(sysconfig.get_path("purelib")).resolve()), installed
          with zipfile.ZipFile(wheel) as archive:
              for resource in ("storage/schema.sql", "data/synonyms.yaml"):
                  expected = archive.read(f"mcp_server_python_docs/{resource}")
                  assert expected and (installed / resource).read_bytes() == expected, resource
          with sqlite3.connect(":memory:") as conn:
              db.bootstrap_schema(conn)
              assert conn.execute("PRAGMA user_version").fetchone()[0] == db.INDEX_FORMAT_VERSION
              conn.execute("SELECT * FROM sections_fts LIMIT 0")
          print(f"Verified wheel resources and installed database bootstrap: {installed}")
          PY

      - name: Run linter
        run: uv run --no-sync ruff check src/ tests/ benchmarks/ ops/ .github/scripts/

      - name: Run type checker
        run: uv run --no-sync pyright src/ benchmarks/

      - name: Run tests
        env:
          UV_BUILD_CONSTRAINT: .github/build-constraints.txt
          UV_REQUIRE_HASHES: "1"
          # Inherit into nested uv run calls; the CLI flag alone is not inherited.
          UV_NO_SYNC: "1"
        run: uv run --no-sync pytest --ignore=tests/benchmarks --tb=short -q

      - name: Validate MCP manifest before publication
        run: |
          bash .github/scripts/install_publisher.sh
          "${RUNNER_TEMP}/mcp-publisher" validate server.json

      - name: Record dist checksums
        id: dist-sha256
        run: |
          set -o pipefail
          {
            echo "dist-sha256<<DIST_SHA256_EOF"
            sha256sum dist/* | LC_ALL=C sort
            echo "DIST_SHA256_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  integration:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: dist

  publish:
    needs: [build, integration]
    runs-on: ubuntu-latest
    name: Publish to PyPI
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          path: dist/

      - name: Verify dist matches the build job
        env:
          EXPECTED: ${{ needs.build.outputs.dist-sha256 }}
        run: |
          set -o pipefail
          [ -n "$EXPECTED" ] || { echo "::error::build exported no checksums"; exit 1; }
          ACTUAL="$(sha256sum dist/* | LC_ALL=C sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dist differs from the files the build job checksummed"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-mcp-registry:
    needs: [eligibility, publish]
    runs-on: ubuntu-latest
    name: Publish to MCP Registry
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.build-sha }}

      - name: Install verified MCP publisher
        run: bash .github/scripts/install_publisher.sh

      - name: Authenticate to MCP Registry
        run: '"${RUNNER_TEMP}/mcp-publisher" login github-oidc'

      - name: Publish to MCP Registry
        run: '"${RUNNER_TEMP}/mcp-publisher" publish'

  github-release:
    needs:
      - eligibility
      - build
      - publish
      - publish-mcp-registry
    runs-on: ubuntu-latest
    name: Create GitHub Release
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          path: dist/

      - name: Verify dist matches the build job
        env:
          EXPECTED: ${{ needs.build.outputs.dist-sha256 }}
        run: |
          set -o pipefail
          [ -n "$EXPECTED" ] || { echo "::error::build exported no checksums"; exit 1; }
          ACTUAL="$(sha256sum dist/* | LC_ALL=C sort)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dist differs from the files the build job checksummed"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.eligibility.outputs.target-tag }}
          files: dist/*
          generate_release_notes: true
