name: Slow E2E

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: false
        default: ''
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  installed-build-index:
    name: Installed build-index (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Download release artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Build package
        if: inputs.artifact-name == ''
        run: uv build

      - name: Install wheel in clean virtual environment
        run: |
          uv run --locked --python ${{ matrix.python-version }} python -m venv .e2e-venv
          .e2e-venv/bin/python -m pip install --upgrade pip
          .e2e-venv/bin/python -m pip install dist/*.whl
          .e2e-venv/bin/python-docs-mcp-server --version

      - name: Smoke test the installed wheel
        run: |
          .e2e-venv/bin/python -m pip install pytest
          cp tests/test_stdio_smoke.py "${RUNNER_TEMP}/test_stdio_smoke.py"
          "${GITHUB_WORKSPACE}/.e2e-venv/bin/python" -m pytest --import-mode=importlib "${RUNNER_TEMP}/test_stdio_smoke.py" -q

      - name: Build and validate full docs index
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/mcp-python-docs-cache
        run: |
          set -o pipefail
          .e2e-venv/bin/python-docs-mcp-server build-index --versions 3.10,3.11,3.12,3.13,3.14 \
            2>&1 | tee "${RUNNER_TEMP}/build-index-${{ matrix.python-version }}.log"
          .e2e-venv/bin/python-docs-mcp-server doctor
          .e2e-venv/bin/python-docs-mcp-server validate-corpus

      - name: Upload E2E logs and cache artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/build-index-${{ matrix.python-version }}.log
            ${{ runner.temp }}/mcp-python-docs-cache
          retention-days: 7
