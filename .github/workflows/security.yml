name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export locked dependencies
        run: |
          uv export \
            --locked \
            --format requirements-txt \
            --all-groups \
            --all-extras \
            --no-emit-project \
            --no-hashes \
            --output-file requirements-audit.txt \
            >/dev/null

      - name: Audit dependencies
        run: |
          uvx pip-audit \
            --requirement requirements-audit.txt \
            --no-deps \
            --disable-pip \
            --progress-spinner off
          # The sandbox image's hashed mcp-server-fetch venv. A separate call: pip-audit
          # refuses to mix a hashed requirements file with an unhashed one.
          uvx pip-audit \
            --requirement benchmarks/sandbox/fetch-requirements.txt \
            --no-deps \
            --disable-pip \
            --progress-spinner off
