name: Product quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-smoke:
    name: Installed package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - name: Build and install wheel without editable source
        run: |
          uv sync --locked --dev
          uv build
          uv venv "${RUNNER_TEMP}/installed"
          uv pip install --python "${RUNNER_TEMP}/installed/bin/python" dist/*.whl pytest
          cp tests/test_stdio_smoke.py "${RUNNER_TEMP}/test_stdio_smoke.py"
          cd "${RUNNER_TEMP}"
          installed/bin/python -m pytest --import-mode=importlib test_stdio_smoke.py -q
